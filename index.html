<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>바이브 FOUR YOU | AI 기반 관광 소비 분산 플랫폼</title>
  <meta name="description" content="하이원리조트 인근 4개 시·군(태백/정선/삼척/영월)의 관광 소비 분산을 돕는 AI 기반 실시간 혼잡도 안내 플랫폼" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===================== 헤더 & 필터 바 ===================== -->
  <header class="app-header">
    <div class="header-inner">
      <div class="brand" id="brandToggle" role="button" tabindex="0" aria-expanded="false" aria-controls="filterBar">
        <span class="brand-eyebrow">TEAM · 바이브 FOUR YOU</span>
        <h1 class="brand-title">
          AI 기반 관광 소비 분산 플랫폼
          <span class="brand-hint">필터 <span class="chevron">▾</span></span>
        </h1>
      </div>
      <div class="header-clock" id="liveClock" aria-live="polite">--:--:--</div>
    </div>

    <div class="filter-bar" id="filterBar" role="region" aria-label="필터 옵션">
      <div class="filter-bar-inner">
        <div class="filter-row filter-scroll" id="shiftFilter" aria-label="시간대 필터">
          <button class="chip is-active" data-filter-type="shift" data-value="전체">전체</button>
          <button class="chip" data-filter-type="shift" data-value="아침">아침 SHIFT</button>
          <button class="chip" data-filter-type="shift" data-value="오후">오후 SHIFT</button>
          <button class="chip" data-filter-type="shift" data-value="저녁">저녁 SHIFT</button>
        </div>

        <div class="filter-row filter-scroll" id="categoryFilter" aria-label="카테고리 필터">
          <button class="chip is-active" data-filter-type="category" data-value="전체">전체</button>
          <button class="chip" data-filter-type="category" data-value="식당·카페">식당·카페</button>
          <button class="chip" data-filter-type="category" data-value="관광지">관광지</button>
          <button class="chip" data-filter-type="category" data-value="숙박">숙박</button>
          <button class="chip" data-filter-type="category" data-value="전기차충전소">전기차 충전소</button>
        </div>

        <div class="filter-row toggle-row">
          <button class="toggle-btn" id="walkToggle" type="button" aria-pressed="false">
            🚶‍♂️ 도보 이동 가능 (하이원 기준 1~2km)
          </button>
          <button class="toggle-btn toggle-btn--accent" id="rerouteToggle" type="button" aria-pressed="false">
            🚦 실시간 우회 추천
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- ===================== 모바일 탭 전환 ===================== -->
  <nav class="mobile-tabs" aria-label="화면 전환">
    <button class="mobile-tab is-active" data-tab="map">🗺️ 지도</button>
    <button class="mobile-tab" data-tab="list">📋 장소 목록</button>
  </nav>

  <!-- ===================== 메인 콘텐츠 ===================== -->
  <main class="main-layout">

    <!-- 좌측: 장소 목록 -->
    <section class="list-panel" id="listPanel" aria-label="장소 목록">
      <div class="list-panel-head">
        <h2>추천 방문 지점</h2>
        <span class="result-count" id="resultCount">0곳</span>
      </div>
      <div class="place-list" id="placeList">
        <!-- JS가 카드 삽입 -->
      </div>
      <p class="empty-state" id="emptyState" hidden>조건에 맞는 장소가 없어요. 필터를 조정해 보세요.</p>
    </section>

    <!-- 우측: 지도 -->
    <section class="map-panel" id="mapPanel" aria-label="지도">
      <div id="map" class="map-canvas"></div>
      <div class="map-legend" aria-label="혼잡도 범례">
        <span class="legend-item"><i class="dot dot--red"></i>혼잡</span>
        <span class="legend-item"><i class="dot dot--yellow"></i>보통</span>
        <span class="legend-item"><i class="dot dot--green"></i>여유</span>
      </div>
    </section>

  </main>

  <footer class="app-footer">
    <p>© 2026 TEAM · 바이브 FOUR YOU — 하이원리조트 인근 4개 시·군 관광 소비 분산 프로젝트</p>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
